<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travbook - Travel Around The World</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/img/logo/favicon.png" type="image/x-icon">

    <!-- Other CSS -->
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/meanmenu.css">
    <link rel="stylesheet" href="assets/css/slick.css">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
    <!-- Header Area Start -->
    <header class="za-nav-header" id="za-NavHeader">
        <div class="za-container">
            <div class="za-header-left d-flex">
                <a href="#" class="za-brand-logo" aria-label="Company Home Page">Travbook</a>

                <nav class="za-desktop-navbar" aria-label="Main Menu">
                    <ul class="za-main-nav-list" id="za-PrimaryNavList">
                        <li class="za-nav-item"><a href="#" class="za-nav-link za-link-active">Home</a>
                        </li>
                        <li class="za-nav-item"><a href="#" class="za-nav-link">About</a></li>
                        <li class="za-nav-item"><a href="#" class="za-nav-link">Destination</a></li>
                        <li class="za-nav-item"><a href="#" class="za-nav-link">Tour</a></li>
                        <li class="za-nav-item"><a href="#" class="za-nav-link">Blog</a></li>
                    </ul>
                </nav>
            </div>


            <div class="za-navbar-actions">
                <button class="za-btn za-btn-primary za-active"
                    type="button">Log In</button>
                <button class="za-btn za-btn-primary" type="button">Sign
                    Up</button>
            </div>

            <button class="za-trigger-burger" id="za-TriggerBurger" type="button" aria-expanded="false"
                aria-controls="za-MobilePanel">
                <span class="za-burger-line"></span>
                <span class="za-burger-line"></span>
                <span class="za-burger-line"></span>
            </button>

        </div>
    </header>
    <!-- mobile menu area -->
    <div class="za-mobile-panel" id="za-MobilePanel" aria-modal="true" role="dialog" tabindex="-1">
        <div class="za-panel-header">
            <button class="za-panel-close" id="za-PanelClose" type="button">&times;</button>
        </div>
        <div class="za-panel-body" id="za-PanelBody"></div>
    </div>

    <div class="za-panel-backdrop" id="za-PanelBackdrop" tabindex="-1"></div>

    <!-- Header Area End -->

    <!-- Footer Area Start -->
    <!-- Footer Area End -->

    <!-- Other js -->
    <script src="assets/js/jquery.js"></script>
    <script src="assets/js/meanmenu.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/slick.js"></script>

    <!-- Theme js -->
    <script src="assets/js/main.js"></script>
</body>

</html>
